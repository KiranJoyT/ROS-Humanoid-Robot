# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    left_arm:
      type: joint_trajectory_controller/JointTrajectoryController


    right_arm:
      type: joint_trajectory_controller/JointTrajectoryController


    head:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm:
  ros__parameters:
    joints:
      - left_shoulder_pitch
      - left_shoulder_roll
      - left_shoulder_yaw
      - left_elbow
      - left_wrist_pitch
      - left_wrist_roll
    command_interfaces:
      []
    state_interfaces:
      []
right_arm:
  ros__parameters:
    joints:
      - right_shoulder_pitch
      - right_shoulder_roll
      - right_shoulder_yaw
      - right_elbow
      - right_wrist_pitch
      - right_wrist_roll
    command_interfaces:
      []
    state_interfaces:
      []
head:
  ros__parameters:
    joints:
      - neck_yaw
      - neck_pitch
    command_interfaces:
      []
    state_interfaces:
      []